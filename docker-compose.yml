name: flight-business-radar

services:
  postgres:
    image: postgres:16-alpine
    container_name: fbr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fbr
      POSTGRES_PASSWORD: fbr
      POSTGRES_DB: fbr
    ports:
      - "5432:5432"
    volumes:
      - fbr-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbr -d fbr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fbr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - fbr-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sidecar Python isolant `fast-flights` (Phase 7). Non démarré par défaut :
  #   docker compose --profile scraper up -d flight-scraper
  flight-scraper:
    build: ./services/flight-scraper
    container_name: fbr-flight-scraper
    restart: unless-stopped
    profiles: ["scraper"]
    environment:
      FLIGHT_SCRAPER_MODE: ${FLIGHT_SCRAPER_MODE:-fixture}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fbr-pg-data:
  fbr-redis-data:
