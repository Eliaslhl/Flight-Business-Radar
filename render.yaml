# Render Blueprint — héberge l'API Fastify (`@fbr/api`) ET le front Next.js
# (`@fbr/web`) sur le plan gratuit, en un seul déploiement.
# La surveillance des prix tourne via le cron GitHub Actions
# (`.github/workflows/poll.yml`) — aucun worker déployé ici. Voir docs/DEPLOY.md.
#
# Région : `ohio` pour coller à une base Neon `us-east-2`. À changer (ex.
# `frankfurt`) si la base est créée en Europe — garder les deux services et la
# base dans la même région.
services:
  # ── API ──────────────────────────────────────────────────────────────────
  - type: web
    name: fbr-api
    runtime: node
    plan: free
    region: ohio
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
    # `--prod=false` : Render force NODE_ENV=production, ce qui ferait sauter les
    # devDependencies (dont @types/node, tailwind…) nécessaires à la compilation.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @fbr/api... build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_PRETTY
        value: "false"
      - key: API_HOST
        value: 0.0.0.0
      # Render route le trafic HTTP vers ce port.
      - key: API_PORT
        value: "10000"
      # À renseigner dans le dashboard Render (jamais commité) :
      - key: DATABASE_URL
        sync: false
      # Facultatif — active la rédaction du conseil par Claude côté API.
      - key: ANTHROPIC_API_KEY
        sync: false

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: fbr-web
    runtime: node
    plan: free
    region: ohio
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @fbr/web... build
    startCommand: pnpm --filter @fbr/web exec next start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Résolu automatiquement vers le hostname public de l'API ci-dessus.
      # `next.config.mjs` préfixe `https://` si le protocole manque.
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: fbr-api
          property: host
